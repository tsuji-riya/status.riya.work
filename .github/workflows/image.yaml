name: image

# proxy/ に変更が入った main への push ごとに ghcr.io/tsuji-riya/status.riya.work:1.0.<実行番号> を作る。
# lab 側は Dependabot がこのタグを見つけて更新 PR を出す
on:
  push:
    branches: [main]
    paths: [proxy/**, .github/workflows/image.yaml]
  pull_request:
    paths: [proxy/**, .github/workflows/image.yaml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # テストはビルド機でネイティブに 1 回だけ回す (QEMU 上の arm64 で回すと遅い)
      - run: cargo test --locked
        working-directory: proxy
      # Rust は QEMU 経由で arm64 もビルドする
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=1.0.${{ github.run_number }}
      - uses: docker/build-push-action@v7
        with:
          context: proxy
          # クラスタにミニ PC (amd64) と Raspberry Pi (arm64) が混ざっている
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
